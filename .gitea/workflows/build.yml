# =============================================================================
# MinGo.Identity - CI/CD Pipeline
# =============================================================================
# Gitea Workflows (compatible with Gitea Act Runner)
#
# Pipeline:
#   Push/Tag → Build (restore + build + test) → Docker (matrix: 3 images)
#
# Required Secrets:
#   REGISTRY_URL        - Gitea Container Registry URL (e.g., gitea.example.com)
#   REGISTRY_USERNAME   - Gitea username for registry login
#   REGISTRY_PASSWORD   - Gitea password or personal access token
#
# Optional:
#   DOTNET_VERSION      - .NET SDK version (default: "10.0.x")
# =============================================================================

name: CI/CD Pipeline
run-name: ${{ gitea.actor }} pushed to ${{ gitea.ref_name }}

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

env:
  DOTNET_VERSION: "10.0.x"
  REGISTRY: ${{ vars.REGISTRY_URL }}
  REGISTRY_USER: ${{ vars.REGISTRY_USERNAME }}
  IMAGE_NAME_PREFIX: mingo-identity-

jobs:
  # ===========================================================================
  # Build & Test
  # ===========================================================================
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build all projects
        run: dotnet build --no-restore -c Release

      - name: Run tests
        run: dotnet test --no-build -c Release --verbosity normal || echo "No test projects found, skipping."

  # ===========================================================================
  # Docker Image Build & Push (parallel matrix)
  # ===========================================================================
  docker:
    name: Docker Build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        service: [idserver, admin, migrator]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Docker tags
        id: tags
        shell: bash
        run: |
          # Always include commit SHA
          TAGS="${{ env.REGISTRY }}/${{ env.REGISTRY_USER }}/MinGo.Identity/${{ env.IMAGE_NAME_PREFIX }}${{ matrix.service }}:${{ gitea.sha }}"

          # Include branch name for main/master
          if [[ "${{ gitea.ref_type }}" == "branch" ]]; then
            TAGS="$TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}${{ matrix.service }}:${{ gitea.ref_name }}"
          fi

          # Include semver tag for version tags
          if [[ "${{ gitea.ref_type }}" == "tag" ]]; then
            TAGS="$TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}${{ matrix.service }}:${{ gitea.ref_name }}"
            TAGS="$TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}${{ matrix.service }}:latest"
          fi

          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.service }}
          push: ${{ gitea.ref_type == 'tag' || gitea.ref_name == 'main' || gitea.ref_name == 'master' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_CONFIGURATION=Release
