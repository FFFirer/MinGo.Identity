# =============================================================================
# MinGo.Identity - Release & Docker Build Workflow
# =============================================================================
# Triggered by:
#   - release: Run tests first, then build and push Docker images (semver tags)
#   - workflow_dispatch: Build and push Docker images only (dev-sha-* tags)
# =============================================================================

name: Release & Docker
run-name: ${{ gitea.actor }} ${{ gitea.ref_name }}

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"
  REGISTRY: ${{ vars.REGISTRY_URL }}
  REGISTRY_USER: ${{ vars.REGISTRY_USERNAME }}
  IMAGE_NAME_PREFIX: identity-

jobs:
  # ===========================================================================
  # Test (release only)
  # ===========================================================================
  test:
    name: Build and Test
    if: gitea.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build all projects
        run: dotnet build --no-restore -c Release

      - name: Run all tests
        run: dotnet test --no-build -c Release

  # ===========================================================================
  # Docker Image Build & Push (parallel matrix)
  # ===========================================================================
  docker:
    name: Docker Build (${{ matrix.service }})
    needs: [test]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [idserver, admin, migrator]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Docker tags
        id: tags
        shell: bash
        run: |
          # Always include commit SHA
          TAGS="${{ env.REGISTRY }}/mingo/${{ env.IMAGE_NAME_PREFIX }}${{ matrix.service }}:${{ gitea.sha }}"

          # Dev tag for manual workflow dispatch (short SHA)
          if [[ "${{ gitea.event_name }}" == "workflow_dispatch" ]]; then
            FULL_SHA="${{ gitea.sha }}"
            SHA_SHORT="${FULL_SHA:0:8}"
            TAGS="$TAGS,${{ env.REGISTRY }}/mingo/${{ env.IMAGE_NAME_PREFIX }}${{ matrix.service }}:dev-sha-${SHA_SHORT}"
          fi

          # Semver + latest for release tags
          if [[ "${{ gitea.ref_type }}" == "tag" ]]; then
            TAGS="$TAGS,${{ env.REGISTRY }}/mingo/${{ env.IMAGE_NAME_PREFIX }}${{ matrix.service }}:${{ gitea.ref_name }}"
            TAGS="$TAGS,${{ env.REGISTRY }}/mingo/${{ env.IMAGE_NAME_PREFIX }}${{ matrix.service }}:latest"
          fi

          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.service }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_CONFIGURATION=Release
