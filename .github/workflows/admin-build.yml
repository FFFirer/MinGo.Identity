name: Admin build, test and publish
run-name: "Admin build - ${{ github.ref_name }}"

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: "admin-build-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build Admin
        run: dotnet build src/MinGo.IdServer.Admin/MinGo.IdServer.Admin.csproj -c Release
      - name: Run unit tests
        run: dotnet test tests/MinGo.Identity.UnitTests/MinGo.Identity.UnitTests.csproj -c Release --logger "trx;LogFileName=unit-tests.trx"
      - name: Verify real Admin OIDC transport and body timeout
        run: python3 scripts/smoke-admin-oidc.py
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: tests/MinGo.Identity.UnitTests/TestResults/*.trx
          if-no-files-found: warn
      - uses: docker/setup-buildx-action@v3
      - name: Determine GHCR image
        id: image
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/identity-admin" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Admin container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.admin
          push: ${{ github.event_name != 'pull_request' }}
          tags: "${{ steps.image.outputs.name }}:sha-${{ github.sha }}"
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
