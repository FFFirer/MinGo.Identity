# =============================================================================
# MinGo.Identity - Integration Test Environment
# =============================================================================
# Usage:
#   # Start test environment
#   docker compose -f docker/docker-compose.test.yml up -d
#
#   # Run tests
#   dotnet test
#
#   # Stop and cleanup
#   docker compose -f docker/docker-compose.test.yml down -v
#
# Access:
#   - HTTP:  http://idserver.local:8080, http://admin.local:8080
#   - HTTPS: https://idserver.local:8443, https://admin.local:8443
# =============================================================================

services:
  # ===========================================================================
  # PostgreSQL Database (Test)
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: mingo-postgres-test
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mingo_identity_test}
    # Random host port to avoid conflicts; use 'docker port mingo-postgres-test 5432' to find it
    ports:
      - ":5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - mingo-test-network

  # ===========================================================================
  # Database Migration (one-shot)
  # ===========================================================================
  migrate:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    container_name: mingo-migrate-test
    working_dir: /src
    volumes:
      - ../:/src
    command: >
      dotnet run --project src/MinGo.Identity.Migrator -- migrate
    environment:
      DOTNET_ENVIRONMENT: Test
      StorageConfiguration__Type: ${STORAGE_TYPE:-POSTGRE}
      StorageConfiguration__ConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB:-mingo_identity_test};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mingo-test-network
    restart: no

  # ===========================================================================
  # IdServer - OIDC/OAuth2 Identity Provider
  # ===========================================================================
  idserver:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    container_name: mingo-idserver-test
    working_dir: /src
    volumes:
      - ../:/src
    command: >
      dotnet run --project src/MinGo.IdServer --no-launch-profile
    environment:
      ASPNETCORE_URLS: http://+:5001
      ASPNETCORE_ENVIRONMENT: Test
      StorageConfiguration__Type: ${STORAGE_TYPE:-POSTGRE}
      StorageConfiguration__ConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB:-mingo_identity_test};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      Authority: ${AUTHORITY:-http://idserver.local:8080}
      AdminUiUrl: ${ADMIN_UI_URL:-http://admin.local:8080}
      IsRealmEnabled: ${IS_REALM_ENABLED:-true}
      IsForwardedEnabled: ${IS_FORWARDED_ENABLED:-true}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5001/readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - mingo-test-network
    restart: unless-stopped

  # ===========================================================================
  # Admin - Blazor Management Dashboard
  # ===========================================================================
  admin:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    container_name: mingo-admin-test
    working_dir: /src
    volumes:
      - ../:/src
    command: >
      dotnet run --project src/MinGo.IdServer.Admin --no-launch-profile
    environment:
      ASPNETCORE_URLS: http://+:5002
      ASPNETCORE_ENVIRONMENT: Test
      IdserverBaseUrl: ${IDSERVER_BASE_URL:-http://idserver:5001}
      ClientId: ${ADMIN_CLIENT_ID:-SIDS-manager}
      ClientSecret: ${ADMIN_CLIENT_SECRET:-password}
      IsRealmEnabled: ${IS_REALM_ENABLED:-true}
      IsForwardedEnabled: ${IS_FORWARDED_ENABLED:-true}
      IgnoreCertificateError: ${IGNORE_CERT_ERROR:-true}
    depends_on:
      idserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5002/readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - mingo-test-network
    restart: unless-stopped

  # ===========================================================================
  # Nginx - Reverse Proxy
  # ===========================================================================
  nginx:
    image: nginx:alpine
    container_name: mingo-nginx-test
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      idserver:
        condition: service_healthy
      admin:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - mingo-test-network
    restart: unless-stopped

networks:
  mingo-test-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_mapping_ipv4: "127.0.0.1"

volumes:
  postgres_test_data:
    driver: local
