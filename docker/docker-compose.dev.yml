# =============================================================================
# MinGo.Identity - Local Development
# =============================================================================
# Usage:
#   # Start all services
#   docker compose -f docker/docker-compose.dev.yml up
#
#   # Start in background
#   docker compose -f docker/docker-compose.dev.yml up -d
#
#   # Stop and cleanup
#   docker compose -f docker/docker-compose.dev.yml down
# =============================================================================

services:
  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: mingo-postgres-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mingo_identity}
    # Random host port to avoid conflicts; use 'docker port mingo-postgres-dev 5432' to find it
    ports:
      - ":5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===========================================================================
  # Build and push Docker images first (optional, auto-builds on up):
  #   docker compose -f docker/docker-compose.dev.yml build
  # ===========================================================================

  # ===========================================================================
  # Migrator - Database migrations & seed data (runs once, then exits)
  # ===========================================================================
  migrator:
    build:
      context: ..
      dockerfile: docker/Dockerfile.migrator
    image: mingo-identity-migrator:dev
    container_name: mingo-migrator-dev
    environment:
      DOTNET_ENVIRONMENT: Production
      StorageConfiguration__Type: ${STORAGE_TYPE:-POSTGRE}
      StorageConfiguration__ConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB:-mingo_identity};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      Authority: ${AUTHORITY:-http://localhost:5001}
      AdminUiUrl: ${ADMIN_UI_URL:-http://localhost:5002}
      IsRealmEnabled: ${IS_REALM_ENABLED:-true}
      IsForwardedEnabled: ${IS_FORWARDED_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy

  # ===========================================================================
  # IdServer - OIDC/OAuth2 Identity Provider
  # ===========================================================================
  idserver:
    build:
      context: ..
      dockerfile: docker/Dockerfile.idserver
    image: mingo-identity-idserver:dev
    container_name: mingo-idserver-dev
    environment:
      ASPNETCORE_URLS: http://+:5001
      ASPNETCORE_ENVIRONMENT: Production
      StorageConfiguration__Type: ${STORAGE_TYPE:-POSTGRE}
      StorageConfiguration__ConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB:-mingo_identity};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      Authority: ${AUTHORITY:-http://localhost:5001}
      AdminUiUrl: ${ADMIN_UI_URL:-http://localhost:5002}
      IsRealmEnabled: ${IS_REALM_ENABLED:-true}
      IsForwardedEnabled: ${IS_FORWARDED_ENABLED:-false}
    ports:
      - "${IDSERVER_PORT:-5001}:5001"
    depends_on:
      migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5001/readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ===========================================================================
  # Admin - Blazor Management Dashboard
  # ===========================================================================
  admin:
    build:
      context: ..
      dockerfile: docker/Dockerfile.admin
    image: mingo-identity-admin:dev
    container_name: mingo-admin-dev
    environment:
      ASPNETCORE_URLS: http://+:5002
      ASPNETCORE_ENVIRONMENT: Production
      IdserverBaseUrl: ${IDSERVER_BASE_URL:-http://idserver:5001}
      ClientId: ${ADMIN_CLIENT_ID:-SIDS-manager}
      ClientSecret: ${ADMIN_CLIENT_SECRET:-password}
      IsRealmEnabled: ${IS_REALM_ENABLED:-true}
      IsForwardedEnabled: ${IS_FORWARDED_ENABLED:-false}
      IgnoreCertificateError: ${IGNORE_CERT_ERROR:-true}
    ports:
      - "${ADMIN_PORT:-5002}:5002"
    depends_on:
      idserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5002/readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_dev_data:
    driver: local
